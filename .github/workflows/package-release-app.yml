name: Package Release App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example v1.2.0"
        required: true
        type: string
      launch_smoke_test:
        description: "Launch the app.zip and pkg payload during release verification"
        required: false
        default: true
        type: boolean
      verify_only:
        description: "Build and verify without uploading or replacing GitHub Release assets"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Build macOS release assets
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      LAUNCH_SMOKE_TEST: ${{ inputs.launch_smoke_test }}

    steps:
      - name: Checkout release tag
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag }}

      - name: Record build environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-diagnostics"
          {
            printf 'ImageOS=%s\nImageVersion=%s\nRUNNER_ARCH=%s\n' \
              "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_ARCH"
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun swift --version
            xcodebuild -showsdks
            git rev-parse HEAD
          } 2>&1 | tee "$RUNNER_TEMP/release-diagnostics/environment.txt"

      - name: Check release configuration
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" ./script/check_release_configuration.sh

      - name: Import self-signed signing certificate
        env:
          CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_P12_BASE64 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CODESIGN_CERTIFICATE_P12_BASE64:-}" ]]; then
            echo "::error::CODESIGN_CERTIFICATE_P12_BASE64 is required for release signing."
            exit 66
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/surge-relay-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/surge-relay-signing.p12"
          printf '%s' "$CODESIGN_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${CODESIGN_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Build and verify release assets
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY || 'Surge Relay Self-Signed Code Signing' }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ -z "${SPARKLE_ED_KEY:-}" ]]; then
            echo "::error::SPARKLE_ED_KEY is required for Sparkle EdDSA update signatures."
            exit 65
          fi
          export REQUIRE_SPARKLE_SIGNATURES=1
          export REQUIRE_STABLE_CODESIGN=1
          export UPDATE_APPCAST=1
          export VERIFY_APPCAST=1
          if [[ "$LAUNCH_SMOKE_TEST" == "true" ]]; then
            export RUN_LAUNCH_SMOKE_TEST=1
          fi
          VERSION="$VERSION" ./script/build_release_assets.sh 2>&1 \
            | python3 -u -c '
          import os, sys
          key = os.environ.get("SPARKLE_ED_KEY", "")
          for line in sys.stdin:
              sys.stdout.write(line.replace(key, "***") if key else line)
          ' | tee "$RUNNER_TEMP/release-diagnostics/build.log"

      - name: Collect compiler diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-diagnostics"
          if [[ -d build/DerivedDataRelease/Build/Intermediates.noindex ]]; then
            while IFS= read -r -d '' diagnostic; do
              destination="$RUNNER_TEMP/release-diagnostics/$diagnostic"
              mkdir -p "$(dirname "$destination")"
              cp "$diagnostic" "$destination"
            done < <(find build/DerivedDataRelease/Build/Intermediates.noindex -type f -name '*.dia' -print0)
          fi

      - name: Upload build diagnostics
        if: ${{ always() }}
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-diagnostics/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload to GitHub Release
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/dist/release-v$VERSION/artifacts"
          assets=(
            "$ARTIFACT_DIR/Surge-Relay-$VERSION.app.zip"
            "$ARTIFACT_DIR/Surge-Relay-$VERSION.app.zip.sha256"
            "$ARTIFACT_DIR/Surge-Relay-$VERSION.pkg"
            "$ARTIFACT_DIR/Surge-Relay-$VERSION.pkg.sha256"
          )
          for signed_metadata in \
            "$ARTIFACT_DIR/Surge-Relay-$VERSION.app.zip.sparkle.txt" \
            "$ARTIFACT_DIR/Surge-Relay-$VERSION.pkg.sparkle.txt"
          do
            [[ -f "$signed_metadata" ]] && assets+=("$signed_metadata")
          done
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Surge Relay $VERSION" \
              --notes "Release assets generated by GitHub Actions."
          fi
          gh release upload "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify uploaded GitHub Release assets
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_SPARKLE_SIGNATURES: "1"
          EXPECT_ADHOC_SIGNATURE: "0"
          EXPECTED_CODESIGN_AUTHORITY: ${{ vars.CODESIGN_IDENTITY || 'Surge Relay Self-Signed Code Signing' }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          verify_args=(
            --tag "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
          )
          if [[ "$LAUNCH_SMOKE_TEST" == "true" ]]; then
            verify_args+=(--launch-smoke-test)
          fi
          VERSION="$VERSION" ./script/verify_github_release_assets.sh "${verify_args[@]}"
