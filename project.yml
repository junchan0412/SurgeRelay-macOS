name: Surge Relay
options:
  bundleIdPrefix: com.allenmiao
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: 108
    MARKETING_VERSION: 2.3.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.3
targets:
  Surge Relay:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    info:
      path: SurgeRelay/Info.plist
      properties:
        CFBundleDisplayName: Surge Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        SUFeedURL: https://raw.githubusercontent.com/junchan0412/SurgeRelay-macOS/main/appcast.xml
        SUPublicEDKey: 3JG2u2H9qhvB178FpLAnhTE8MEs5ng4CrEaDosYUWvM=
        SUEnableAutomaticChecks: true
    sources:
      - path: SurgeRelay
        excludes:
          - WebResources
      - path: SurgeRelay/WebResources
        type: folder
        buildPhase: resources
      - path: Surge Relay.icon
        buildPhase: resources
    dependencies:
      - sdk: JavaScriptCore.framework
      - package: Sparkle
      - target: SurgeRelayScriptWorker
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenmiao.SurgeRelay
        PRODUCT_NAME: Surge Relay
        PRODUCT_MODULE_NAME: SurgeRelay
        ASSETCATALOG_COMPILER_APPICON_NAME: Surge Relay
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
  SurgeRelayScriptWorker:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: SurgeRelayScriptWorker
      - path: SurgeRelay/Services/ScriptHubNetworkPolicy.swift
      - path: SurgeRelay/Services/ScriptHubWorkerFiles.swift
      - path: SurgeRelay/Services/SourceRetryAfter.swift
      - path: SurgeRelay/Models/StageMetric.swift
      - path: SurgeRelay/Models/RelayError.swift
    dependencies:
      - sdk: JavaScriptCore.framework
    settings:
      base:
        PRODUCT_NAME: SurgeRelayScriptWorker
        PRODUCT_BUNDLE_IDENTIFIER: com.allenmiao.SurgeRelay.ScriptWorker
        CODE_SIGN_ENTITLEMENTS: SurgeRelayScriptWorker/SurgeRelayScriptWorker.entitlements
        INFOPLIST_FILE: SurgeRelayScriptWorker/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
  Surge RelayTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: SurgeRelayTests
    dependencies:
      - target: Surge Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenmiao.SurgeRelayTests
        GENERATE_INFOPLIST_FILE: YES
  SurgeRelayUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: SurgeRelayUITests
    dependencies:
      - target: Surge Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenmiao.SurgeRelayUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Surge Relay:
    build:
      targets:
        Surge Relay: all
        Surge RelayTests: [test]
    test:
      environmentVariables:
        SURGE_RELAY_UI_QA: "1"
      targets:
        - Surge RelayTests
  Surge Relay UI Tests:
    build:
      targets:
        Surge Relay: all
        SurgeRelayUITests: [test]
    test:
      targets:
        - SurgeRelayUITests
